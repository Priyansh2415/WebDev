<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudentHub Portal - Login</title>
</head>

<body style="margin:0;font-family:Arial,Helvetica,sans-serif;background:#f2f2f2;">

<div style="width:90%;max-width:450px;margin:60px auto;background:white;padding:30px;border-radius:12px;box-shadow:0 0 15px lightgray;">

<h1 style="text-align:center;color:#003366;">StudentHub Portal</h1>

<p style="text-align:center;color:gray;">
Student Login System
</p>

<hr>

<form>

<label><b>Select Role</b></label><br><br>

<select style="width:100%;padding:12px;border-radius:5px;">
<option>Admin</option>
<option>Teacher</option>
<option>Student</option>
</select>

<br><br>

<label><b>Username</b></label><br>

<input
type="text"
placeholder="Enter Username"
style="width:100%;padding:12px;border:1px solid gray;border-radius:5px;">

<br><br>

<label><b>Password</b></label><br>

<input
type="password"
placeholder="Enter Password"
style="width:100%;padding:12px;border:1px solid gray;border-radius:5px;">

<br><br>

</form>

<h3 align="center">Login As</h3>

<div style="display:flex;flex-wrap:wrap;justify-content:center;gap:10px;">

<a href="admin.html"
style="text-decoration:none;background:#0066cc;color:white;padding:12px 22px;border-radius:6px;">
Admin
</a>

<a href="teacher.html"
style="text-decoration:none;background:#28a745;color:white;padding:12px 22px;border-radius:6px;">
Teacher
</a>

<a href="student.html"
style="text-decoration:none;background:#ff9800;color:white;padding:12px 22px;border-radius:6px;">
Student
</a>

</div>

<hr>

<h3>Demo Login</h3>

<table border="1" width="100%" cellpadding="8" cellspacing="0">
<tr bgcolor="#003366" style="color:white;">
<th>Role</th>
<th>Username</th>
<th>Password</th>
</tr>

<tr>
<td>Admin</td>
<td>admin</td>
<td>admin123</td>
</tr>

<tr>
<td>Teacher</td>
<td>teacher</td>
<td>teacher123</td>
</tr>

<tr>
<td>Student</td>
<td>student</td>
<td>student123</td>
</tr>

</table>

<br>

<p align="center">
© 2026 StudentHub Portal
</p>

</div>

</body>
</html>
